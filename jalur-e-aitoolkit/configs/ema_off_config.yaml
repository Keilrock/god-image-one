# EMA-OFF run — winner recipe 5FW2Eaae VERBATIM, satu-satunya beda: ema_config.use_ema=false
# Tujuan Fase 3: konfirmasi Δweight ~266 (≈pemenang 246) DAN eval LOSS-nya.
# Gerbang: loss ~0.073 = nyamain pemenang; ~0.084/naik = terima (udah nyalip boss 0.0867).
config:
  name: ema_off
  process:
  - datasets:
    - cache_latents_to_disk: true
      caption_ext: txt
      folder_path: /ephemeral/datasets/qwen_t2_train/train_data
      is_reg: false
      resolution:
      - 512
      - 768
      - 1024
    device: cuda
    model:
      arch: qwen_image
      low_vram: true
      name_or_path: /cache/models/gradients-io-tournaments--Qwen-Image
      qtype: float8
      quantize: true
      quantize_te: true
    network:
      linear: 128
      linear_alpha: 128
      type: lora
    save:
      dtype: bf16
      max_step_saves_to_keep: 6
      save_every: 36
      save_format: diffusers
    train:
      batch_size: 1
      cache_text_embeddings: true
      cfg_scale: 6.0
      do_cfg: true
      dtype: bf16
      ema_config:
        ema_decay: 0.995
        use_ema: false          # <<< SATU-SATUNYA PERUBAHAN dari winner config
      gradient_accumulation: 1
      gradient_checkpointing: true
      lr: 0.0001
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      optimizer_params:
        weight_decay: 1.0e-05
      steps: 108
      timestep_type: weighted
      train_text_encoder: false
      train_unet: true
    training_folder: /ephemeral/output
    trigger_word: David Miller
    type: diffusion_trainer
job: extension
meta:
  name: qwen_image_lora_ema_off
  version: '1.0'
