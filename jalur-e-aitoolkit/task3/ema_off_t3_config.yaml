# Task #3 art/style EMA-OFF — recipe boss-art 5GU4 VERBATIM, satu beda use_ema:false.
# NO trigger word (style "Dreamlike and Digital Art" dijahit di caption prosa).
# REVISI: target ~1100 step (boss ke-cut window @1000, optimize 2500 sia-sia).
# save tiap 200 (kurva 200/400/600/800/1000 + 1100 final), eval fokus 600/800/1000/1100.
config:
  name: ema_off_t3
  process:
  - datasets:
    - cache_latents_to_disk: true
      caption_ext: txt
      folder_path: /ephemeral/task3_train/train_data
      is_reg: false
      resolution:
      - 512
      - 768
      - 1024
    device: cuda
    model:
      arch: qwen_image
      low_vram: true
      name_or_path: /cache/models/gradients-io-tournaments--Qwen-Image-Jib-Mix
      qtype: float8
      quantize: true
      quantize_te: true
    network:
      linear: 128
      linear_alpha: 128
      type: lora
    save:
      dtype: bf16
      max_step_saves_to_keep: 8
      save_every: 200
      save_format: diffusers
    train:
      batch_size: 1
      cache_text_embeddings: true
      cfg_scale: 6.0
      do_cfg: true
      dtype: bf16
      ema_config:
        ema_decay: 0.995
        use_ema: false          # <<< SATU-SATUNYA beda dari boss-art
      gradient_accumulation: 1
      gradient_checkpointing: true
      lr: 0.0001
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      optimizer_params:
        weight_decay: 1.0e-05
      steps: 1100
      timestep_type: weighted
      train_text_encoder: false
      train_unet: true
    training_folder: /ephemeral/output_t3
    type: diffusion_trainer       # NO trigger_word (art/style)
job: extension
meta:
  name: qwen_image_lora_t3_ema_off
  version: '1.0'
